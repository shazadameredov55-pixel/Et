name: AI Digital Product Agent

# Triggered two ways:
# 1. Manually from the Actions UI ("Run workflow") for research or a
#    manual mode=produce (see README "Manual approval without the bot").
# 2. By the Telegram bot's GitHubDispatcher (src/telegram_bot/github_dispatch.py)
#    calling the workflow_dispatch API when you tap APPROVE, using a PAT
#    stored on the bot's own host (GITHUB_TOKEN there — NOT this
#    workflow's auto-injected token, which cannot trigger other runs).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "research (find + score a new opportunity) or produce (generate an approved product)"
        required: true
        type: choice
        options:
          - research
          - produce
      category:
        description: "Product category (currently only personal-finance is wired up)"
        required: false
        default: "personal-finance"
      research_depth:
        description: "How many niches to scan in research mode"
        required: false
        type: choice
        options:
          - quick
          - standard
          - deep
        default: "standard"
      quality_threshold:
        description: "Minimum QC/critique score (0-100) to accept a produced product"
        required: false
        default: "80"
      product_id:
        description: "Required for mode=produce: the product_id from the Telegram approval message"
        required: false
        default: ""
      run_id:
        description: "Required for mode=produce: the run_id from the Telegram approval message"
        required: false
        default: ""

# Never run two agent jobs at once — both modes touch the same
# data/products.db file, and concurrent runs could race on committing it.
concurrency:
  group: ai-digital-product-agent
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit data/products.db back to the repo

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Note: data/products.db is persisted by committing it back into the
      # repo (see "Persist product-memory database" step below) rather than
      # via actions/upload-artifact + download-artifact. Artifacts in v4 are
      # scoped to a single workflow run, so a later, separate run (e.g. a
      # research run followed by a produce run) cannot download an
      # artifact uploaded by an earlier run — the DB would silently reset
      # to empty every time. Committing to the repo sidesteps that
      # entirely: checkout above always gets the latest committed DB.

      - name: Run agent (research)
        if: ${{ github.event.inputs.mode == 'research' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AUTHORIZED_USER_ID: ${{ secrets.AUTHORIZED_USER_ID }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_MODEL: ${{ secrets.AI_API_MODEL }}
          RESEARCH_RSS_FEED_URL: ${{ secrets.RESEARCH_RSS_FEED_URL }}
          RESEARCH_PAGE_URL: ${{ secrets.RESEARCH_PAGE_URL }}
        run: |
          python scripts/run_agent.py \
            --mode research \
            --category "${{ github.event.inputs.category }}" \
            --research-depth "${{ github.event.inputs.research_depth }}"

      - name: Run agent (produce)
        if: ${{ github.event.inputs.mode == 'produce' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AUTHORIZED_USER_ID: ${{ secrets.AUTHORIZED_USER_ID }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_MODEL: ${{ secrets.AI_API_MODEL }}
        run: |
          python scripts/run_agent.py \
            --mode produce \
            --product-id "${{ github.event.inputs.product_id }}" \
            --run-id "${{ github.event.inputs.run_id }}" \
            --quality-threshold "${{ github.event.inputs.quality_threshold }}"

      - name: Persist product-memory database
        # Always commit, even if the job above failed partway, so state
        # (e.g. a product stuck mid-pipeline) isn't lost between runs.
        # Commits straight to the branch this workflow ran on — safe here
        # because the concurrency group above guarantees only one agent
        # run (and therefore one commit) happens at a time.
        if: always()
        run: |
          git config user.name "ai-digital-product-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/products.db
          if git diff --cached --quiet; then
            echo "No change to data/products.db, nothing to commit."
          else
            git commit -m "chore: update product-memory database [skip ci]"
            git push
          fi

      - name: Upload generated product files
        # Only produce mode creates anything here; upload is a no-op-safe
        # convenience in case you want to grab the ZIP straight from the
        # Actions run instead of waiting on the Telegram delivery.
        if: ${{ github.event.inputs.mode == 'produce' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: product-output-${{ github.event.inputs.product_id }}
          path: |
            output/**/*.zip
            output/**/metadata.json
          retention-days: 30
          if-no-files-found: ignore
