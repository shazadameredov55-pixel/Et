name: Etsy AI Headphones Scraper Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Her gün gece 00:00'da otomatik çalışır

jobs:
  scrape-etsy:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Tarayıcı ve Bağımlılıkları Yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libgconf-2-4
          python -m pip install --upgrade pip
          pip install anthropic botasaurus beautifulsoup4

      - name: AI Scraper Scriptini Çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python main.py

      - name: Çıktıyı GitHub Depoyla Eşitle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add etsy_1000_headphones_clean.json || true
          git commit -m "Automated Etsy 1000 Headphones JSON update" || true
          git push || true
          
