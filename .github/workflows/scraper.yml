name: Etsy Scraper Worker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Chrome Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Kodu Çalıştır
      run: python main.py

    - name: Excel Dosyasını Kaydet
      uses: actions/upload-artifact@v3
      with:
        name: etsy-excel-verileri
        path: etsy_digital_products.xlsx
