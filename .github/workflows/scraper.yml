name: Botasaurus Etsy Scraper Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  scrape-etsy:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Google Chrome ve Bağımlılıkları Kur (Botasaurus için)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libnss3 libgconf-2-4 libasound2
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -fy

      - name: Python Bağımlılıklarını Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests botasaurus

      - name: Scraper Scriptini Çalıştır
        run: |
          python main.py

      - name: Excel Dosyasını Depoya Commit Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_outputs/
          git commit -m "auto: Botasaurus ile 1000 kulaklık verisi güncellendi [skip ci]" || echo "Değişiklik yok"
          git push
          
