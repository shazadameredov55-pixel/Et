# Each profile is a coherent design system, not just a color swatch.
# ProfileSelector picks one based on ProductSpec.target_customer / UX needs,
# never at random. Every field here is consumed by src/design/style_engine.py.

profiles:
  minimal_professional:
    name: "Minimal Professional"
    best_for: ["freelancer", "small_business", "professional"]
    typography:
      heading_font: "Calibri"
      body_font: "Calibri"
      heading_size_pt: 14
      body_size_pt: 10
    spacing:
      row_height: 18
      section_gap_rows: 2
    hierarchy: "flat"          # flat | grouped | dashboard
    layout: "single_sheet_sections"
    table_design:
      header_fill: "1F2937"
      header_font_color: "FFFFFF"
      banded_rows: true
    visual_density: "low"
    icon_usage: "none"

  modern_clean:
    name: "Modern Clean"
    best_for: ["student", "young_professional"]
    typography:
      heading_font: "Segoe UI"
      body_font: "Segoe UI"
      heading_size_pt: 13
      body_size_pt: 10
    spacing:
      row_height: 20
      section_gap_rows: 2
    hierarchy: "grouped"
    layout: "multi_tab"
    table_design:
      header_fill: "2563EB"
      header_font_color: "FFFFFF"
      banded_rows: true
    visual_density: "medium"
    icon_usage: "minimal"

  premium_finance:
    name: "Premium Finance"
    best_for: ["high_income", "net_worth_tracking", "small_business"]
    typography:
      heading_font: "Georgia"
      body_font: "Calibri"
      heading_size_pt: 16
      body_size_pt: 10.5
    spacing:
      row_height: 20
      section_gap_rows: 3
    hierarchy: "dashboard"
    layout: "multi_tab_dashboard"
    table_design:
      header_fill: "0F172A"
      header_font_color: "D4AF37"
      banded_rows: true
    visual_density: "medium"
    icon_usage: "moderate"

  soft_neutral:
    name: "Soft Neutral"
    best_for: ["student", "budget_beginner"]
    typography:
      heading_font: "Verdana"
      body_font: "Verdana"
      heading_size_pt: 12
      body_size_pt: 10
    spacing:
      row_height: 18
      section_gap_rows: 2
    hierarchy: "flat"
    layout: "single_sheet_sections"
    table_design:
      header_fill: "94A3B8"
      header_font_color: "1F2937"
      banded_rows: false
    visual_density: "low"
    icon_usage: "none"

  corporate:
    name: "Corporate"
    best_for: ["small_business", "team_use"]
    typography:
      heading_font: "Arial"
      body_font: "Arial"
      heading_size_pt: 13
      body_size_pt: 10
    spacing:
      row_height: 18
      section_gap_rows: 2
    hierarchy: "grouped"
    layout: "multi_tab"
    table_design:
      header_fill: "374151"
      header_font_color: "FFFFFF"
      banded_rows: true
    visual_density: "medium"
    icon_usage: "minimal"

  mobile_first:
    name: "Mobile First"
    best_for: ["on_the_go_user", "freelancer"]
    typography:
      heading_font: "Calibri"
      body_font: "Calibri"
      heading_size_pt: 12
      body_size_pt: 11
    spacing:
      row_height: 22
      section_gap_rows: 1
    hierarchy: "flat"
    layout: "single_sheet_wide_rows"
    table_design:
      header_fill: "059669"
      header_font_color: "FFFFFF"
      banded_rows: true
    visual_density: "low"
    icon_usage: "moderate"

  print_friendly:
    name: "Print Friendly"
    best_for: ["offline_planner", "paycheck_budget"]
    typography:
      heading_font: "Times New Roman"
      body_font: "Times New Roman"
      heading_size_pt: 13
      body_size_pt: 10
    spacing:
      row_height: 16
      section_gap_rows: 2
    hierarchy: "grouped"
    layout: "print_optimized"
    table_design:
      header_fill: "000000"
      header_font_color: "FFFFFF"
      banded_rows: false
    visual_density: "high"
    icon_usage: "none"
