paths:
  database_file: "data/products.db"
  output_dir: "output"
  temp_dir: "tmp"

# Persistence of product memory across ephemeral GitHub Actions runs.
persistence:
  artifact_name: "product-memory-db"
  artifact_retention_days: 90

research:
  request_timeout_seconds: 10
  max_retries: 3
  backoff_base_seconds: 2
  rate_limit_requests_per_minute: 20
  respect_robots_txt: true
  user_agent: "AIDigitalProductAgent/1.0 (research; contact-via-telegram-bot)"

ai_provider:
  # Order matters: registry tries providers in this order and falls back.
  fallback_order:
    - "free_api"
    - "rule_based"
  request_timeout_seconds: 20
  max_retries: 2

quality:
  minimum_pass_score: 80
  max_revisions: 3

telegram:
  # Actual token/user id come from GitHub Secrets (TELEGRAM_BOT_TOKEN,
  # AUTHORIZED_USER_ID) via environment variables — never stored here.
  poll_timeout_seconds: 30

logging:
  level: "INFO"
  log_dir: "logs"
